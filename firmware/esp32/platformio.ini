[platformio]
default_envs = firebeetle32

[env]
platform = espressif32@6.12.0
board = firebeetle32
framework = arduino
monitor_speed = 115200
; Arduino BLE logs the passkey at INFO. Suppress framework logs; the security
; callback displays it only in interactive serial (never enable log capture).
build_flags = -DCORE_DEBUG_LEVEL=0
; The glove owner's module is linked only by the *-glove environments, which
; clear this; the dummy defines the same functions.
lib_ignore = glove_sensor
; Optional reproducible fixtures: add -DCOMMS_FIXTURE_SEED=12345.
; Initial physical source rate: -DCOMMS_INITIAL_RATE_HZ=10 (valid 1..200).
; Sensor scaling (comms_sample.h, provisional): out-of-range values are clamped;
; -DCOMMS_OUT_OF_RANGE_DROP=1 refuses the sample instead.
; Glove module (include/comms_glove.h): -DCOMMS_GLOVE_MODULE=0 (default) links the
; built-in dummy, src/dummy_glove.cpp; 1 links the glove owner's module (the
; *-glove environments below): lib/glove_sensor, a byte-identical copy of
; hardware/gloves/integration_files made by python -m tools.sync_glove_module,
; with the send decision in src/glove_module.cpp. -DCOMMS_GLOVE_SEND_ALL=1 sends
; every sample, IDLE included (recording sessions).
; Dummy movement gate (dummy module only): -DCOMMS_DUMMY_IDLE_MS=7000 sends for
; COMMS_DUMMY_MOVING_MS (default 3000), then skips IDLE ticks for 7 s, repeating
; from boot; the source statistics then report a gated source. IDLE_MS 0
; (default) always sends.

[env:firebeetle32]

[env:firebeetle32-left]
build_flags =
    ${env.build_flags}
    -DCOMMS_DEVICE_ID=1

[env:firebeetle32-right]
build_flags =
    ${env.build_flags}
    -DCOMMS_DEVICE_ID=2

; The real gloves: Siqiang's sensor module, continuously sending IDLE too, at the
; model's 50 Hz from boot (the laptop can still change the rate).
[env:firebeetle32-left-glove]
lib_ignore =
build_flags =
    ${env.build_flags}
    -DCOMMS_DEVICE_ID=1
    -DCOMMS_GLOVE_MODULE=1
    -DCOMMS_INITIAL_RATE_HZ=50
    -DCOMMS_GLOVE_SEND_ALL=1

[env:firebeetle32-right-glove]
lib_ignore =
build_flags =
    ${env.build_flags}
    -DCOMMS_DEVICE_ID=2
    -DCOMMS_GLOVE_MODULE=1
    -DCOMMS_INITIAL_RATE_HZ=50
    -DCOMMS_GLOVE_SEND_ALL=1

[env:firebeetle32-unprotected-diagnostic]
build_flags =
    ${env.build_flags}
    -DCOMMS_UNPROTECTED_DIAGNOSTIC=1



; Opt-in local recorder format: v4 / LCS4 / 40 bytes / flex3 GPIO39.
; Legacy demo.py / Ultra96 / phone bridges still require v3 and are not migrated.
[env:firebeetle32-left-glove-flex3]
extends = env:firebeetle32-left-glove
build_flags =
    ${env:firebeetle32-left-glove.build_flags}
    -DCOMMS_FLEX3_GLOVE=1

[env:firebeetle32-right-glove-flex3]
extends = env:firebeetle32-right-glove
build_flags =
    ${env:firebeetle32-right-glove.build_flags}
    -DCOMMS_FLEX3_GLOVE=1

; Bare boards without sensors (transport tests of the three-flex pipeline): the built-in
; dummy module in the three-flex format (v4, 40 bytes, LCS4; flex3 is always 0), sending
; every tick at the model's 50 Hz from boot (the laptop can still change the rate).
[env:firebeetle32-left-flex3]
extends = env:firebeetle32-left
build_flags =
    ${env:firebeetle32-left.build_flags}
    -DCOMMS_FLEX3_GLOVE=1
    -DCOMMS_INITIAL_RATE_HZ=50

[env:firebeetle32-right-flex3]
extends = env:firebeetle32-right
build_flags =
    ${env:firebeetle32-right.build_flags}
    -DCOMMS_FLEX3_GLOVE=1
    -DCOMMS_INITIAL_RATE_HZ=50

; Diagnostic ±500 dps sensor range. BLE v4 gyro scaling remains 100.
; Accept these recordings only after gyro_trial_audit confirms transport headroom.
[env:firebeetle32-left-glove-flex3-g500]
extends = env:firebeetle32-left-glove-flex3
build_flags =
    ${env:firebeetle32-left-glove-flex3.build_flags}
    -DGLOVE_GYRO_RANGE_DPS=500

[env:firebeetle32-right-glove-flex3-g500]
extends = env:firebeetle32-right-glove-flex3
build_flags =
    ${env:firebeetle32-right-glove-flex3.build_flags}
    -DGLOVE_GYRO_RANGE_DPS=500

; LOCAL diagnostic recorder only: v5/LCS5, gyro *10, ±1000 dps sensor.
; Existing v4 bridges deliberately refuse this version until explicitly migrated.
[env:firebeetle32-left-glove-flex3-wide]
extends = env:firebeetle32-left-glove-flex3
build_flags =
    ${env:firebeetle32-left-glove-flex3.build_flags}
    -DCOMMS_WIDE_GYRO=1
    -DGLOVE_GYRO_RANGE_DPS=1000

[env:firebeetle32-right-glove-flex3-wide]
extends = env:firebeetle32-right-glove-flex3
build_flags =
    ${env:firebeetle32-right-glove-flex3.build_flags}
    -DCOMMS_WIDE_GYRO=1
    -DGLOVE_GYRO_RANGE_DPS=1000
